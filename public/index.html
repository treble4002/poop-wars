<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Poop Wars 💩</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f6efe3;color:#3b2616;max-width:480px;margin:auto;padding:10px 10px 84px}
h1{text-align:center;margin:6px 0;font-size:28px}h2{margin:14px 0 6px;font-size:19px}.card{background:#fff;border-radius:16px;padding:12px;margin:8px 0;box-shadow:0 2px 6px #0002}
button{background:#7b4a26;color:#fff;border:0;border-radius:12px;padding:11px 14px;font-size:16px;margin:3px 2px;cursor:pointer}button.alt{background:#d9c2a3;color:#3b2616}button:disabled{opacity:.35}
button.sm{padding:7px 9px;font-size:15px}input{font-size:16px;padding:11px;border-radius:12px;border:2px solid #d9c2a3;width:100%;margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #eee}
.arcade{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border-radius:18px;padding:14px 8px;text-align:center;color:#fff;box-shadow:0 3px 0 #0004;cursor:pointer;user-select:none}
.tile b{display:block;font-size:15px;margin-top:4px}.tile span{font-size:40px}.tile small{opacity:.9;font-size:12px}
.tile:active{transform:translateY(2px)}
.tabs{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}.tabs button{white-space:nowrap;flex:none}.tabs .on{background:#e0a030}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ttt div{aspect-ratio:1;background:#e9dcc8;border-radius:12px;font-size:44px;display:flex;align-items:center;justify-content:center}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#5d8bb0;padding:6px;border-radius:12px}.c4 div{aspect-ratio:1;background:#f6efe3;border-radius:50%;font-size:24px;display:flex;align-items:center;justify-content:center}
.dots{display:grid;grid-template-columns:repeat(4,16px 1fr) 16px;grid-template-rows:repeat(4,16px auto) 16px}
.dots .d{background:radial-gradient(circle,#3b2616 35%,transparent 40%)}.dots .h,.dots .v{background:#eee3d2;border-radius:6px;margin:3px;cursor:pointer}
.dots .p0{background:#7b4a26}.dots .p1{background:#e0a030}.dots .b{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:30px}
.sea{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:#5d8bb0;padding:4px;border-radius:10px}.sea div{aspect-ratio:1;background:#cfe3f0;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px}
.sea.small div{font-size:13px}.sea .ship{background:#d9c2a3}.sea .tap{cursor:pointer}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.kb button{margin:0;padding:10px 0}
.word{font-size:30px;letter-spacing:6px;text-align:center;font-weight:bold;font-family:monospace;word-break:break-all}
.big{font-size:18px;text-align:center}.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pads div{aspect-ratio:1;border-radius:20px;font-size:56px;display:flex;align-items:center;justify-content:center;opacity:.45;user-select:none;touch-action:manipulation;transition:opacity .08s,transform .08s}.pads div.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 24px #fff8}.tapper{font-size:120px;user-select:none;text-align:center;touch-action:manipulation}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:6px;box-shadow:0 -2px 6px #0002}nav button{flex:1}
</style></head><body><h1>💩 Poop Wars 🚽</h1><div id="app"></div>
<nav id="nav" style="display:none"><button onclick="go('home')">🕹️ Arcade</button><button onclick="go('games')">🎮 Games</button><button onclick="go('lb')">🏆 Ranks</button></nav>
<script>
let T=localStorage.pwToken,me=null,poll=null,place={};const $=document.getElementById('app');
const api=async(p,b)=>{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','x-token':T||''},body:b&&JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error);return j};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');const err=e=>alert('🚫 '+e.message);
const G={ttt:{n:'Tic-Tac-Toilet',e:'#️⃣',c:'#8e5b34',d:'3 in a row'},c4:{n:'Connect Four-Flush',e:'🔴',c:'#4f7ea6',d:'Drop 4 in a row'},follow:{n:'Follow the Flush',e:'🚽',c:'#3a9b8f',d:'Memory pattern race'},
 dots:{n:'Stall Wars',e:'🚪',c:'#b0643a',d:'Claim the most stalls'},sink:{n:'Sink the Stink',e:'🦆',c:'#3f6fb5',d:'Find their hidden clogs'},hang:{n:'Hang-Ten TP',e:'🧻',c:'#a04f8f',d:'Guess the word'}};
const SHIPS=[{n:'Mega Clog',e:'💩',s:4},{n:'Rubber Duck',e:'🦆',s:3},{n:'Plunger',e:'🪠',s:3},{n:'TP Roll',e:'🧻',s:2}];
const MK=['🧻','💩'];const fb=b=>`${b.len} long · ${(b.ms/1000).toFixed(1)}s`;const rec=s=>(s?`${s.w}W ${s.l}L ${s.d}D`:'0W 0L 0D')+(s&&s.best?` <small>· best ${fb(s.best)}</small>`:'');
async function go(v,a,b){clearInterval(poll);scrollTo(0,0);try{
 if(!T)return signup();me=await api('me');document.getElementById('nav').style.display='flex';
 if(v==='circle')return circle(a,b);if(v==='game')return game(a);if(v==='lb')return lb(a);if(v==='pick')return pick(a);if(v==='games')return games();home()}catch(e){if(/Sign up/.test(e.message)){T=null;localStorage.removeItem('pwToken');signup()}else err(e)}}
function signup(){$.innerHTML=`<div class="card big">Head-to-head mini games for your bathroom break.<br><br><input id=n placeholder="Pick a silly name (e.g. Sir Plops)" maxlength=20><button onclick="doSignup()">Enter the stall 🚪</button></div>`}
async function doSignup(){try{const u=await api('signup',{name:n.value});T=u.token;localStorage.pwToken=T;go('home')}catch(e){err(e)}}
async function home(){const gs=await api('games'),turns=gs.filter(g=>g.myTurn).length;
 $.innerHTML=`<div class="card row"><span>Hi <b>${esc(me.name)}</b> 👋<br><small>Ranked: ${rec(me.stats.all)} · vs 🪠 Bot: ${rec(me.botStats.all)}</small></span>${turns?`<button onclick="go('games')">👉 ${turns} your turn</button>`:''}</div>
 <h2>🕹️ The Arcade</h2><div class=arcade>${Object.entries(G).map(([k,x])=>`<div class=tile style="background:${x.c}" onclick="go('pick','${k}')"><span>${x.e}</span><b>${x.n}</b><small>${x.d}</small></div>`).join('')}</div>
 <h2>👨‍👩‍👧 Your circles</h2>${me.circleList.map(c=>`<div class="card row" onclick="go('circle','${c.id}')"><b>${esc(c.name)}</b><span>Code: ${c.code} ›</span></div>`).join('')||'<div class=card>Make a circle and share the code in your family group chat.</div>'}
 <div class=card><input id=cn placeholder="New circle name (e.g. The Throne Room)"><button onclick="mk()">Create circle</button><hr><input id=cc placeholder="Invite code" maxlength=6 style="text-transform:uppercase"><button class=alt onclick="jn()">Join circle</button></div>`;
 poll=setInterval(async()=>{const g2=await api('games');if(g2.filter(g=>g.myTurn).length!==turns)home()},6000)}
async function games(){const gs=await api('games');
 $.innerHTML=`<h2>🎮 Your games</h2>${gs.map(g=>`<div class="card row" onclick="go('game','${g.id}')"><span>${G[g.type].e} ${G[g.type].n}<br><small>vs ${esc(g.names[1-g.me])}${g.vsBot?' ('+g.diff+')':''}</small></span><b>${g.status==='done'?(g.winner===me.id?'🏆 Won':g.winner==='draw'?'🤝 Draw':'💀 Lost'):g.myTurn?'👉 Your turn':'⏳ Waiting'}</b></div>`).join('')||'<div class=card>No games yet. Pick one in the Arcade!</div>'}`;
 poll=setInterval(async()=>{const g2=await api('games');if(JSON.stringify(g2.map(g=>g.updated))!==JSON.stringify(gs.map(g=>g.updated)))games()},5000)}
function pick(t){const x=G[t];
 $.innerHTML=`<div class="card big" style="background:${x.c};color:#fff"><span style="font-size:50px">${x.e}</span><br><b>${x.n}</b><br><small>${HELP[t]}</small></div>
 <h2>🪠 Solo vs Plunger Bot</h2><div class=card><button onclick="ch(null,'bot','${t}','easy')">😌 Easy</button><button onclick="ch(null,'bot','${t}','hard')">😈 Hard</button><br><small>Bot games go on your separate "vs Bot" record, not the rankings.</small></div>
 <h2>⚔️ Challenge someone</h2>${t==='hang'?`<div class=card><input id=sw maxlength=12 placeholder="Optional: secret word for them (3–12 letters)"><small>Leave blank and we'll pick a random one.</small></div>`:''}
 ${me.circleList.map(c=>`<div class=card><b>${esc(c.name)}</b>${c.members.map(m=>`<div class=row><span>${esc(m.name)}</span><button class=sm onclick="ch('${c.id}','${m.id}','${t}')">Challenge</button></div>`).join('')||'<br><small>Nobody else here yet. Share code <b>'+c.code+'</b></small>'}</div>`).join('')||'<div class=card>Join or create a circle on the Arcade screen to challenge friends.</div>'}`}
const HELP={ttt:'Get 3 in a row. 🧻 goes first.',c4:'Drop pieces into columns. First to 4 in a row wins.',follow:'Watch the pads light up, then repeat the pattern. It grows by one each round until you slip. Longest pattern wins; tie goes to the faster fingers. You both get the same pattern.',
 dots:'Take turns drawing walls. Close the 4th wall of a stall to claim it and go again. Most stalls wins.',sink:'Hide your 4 items, then take turns firing at their 8×8 pipes. Sink everything first to win.',
 hang:'Guess your word one letter at a time. Each miss unrolls a sheet of TP (7 sheets). Fewest misses wins.'};
async function mk(){try{const c=await api('circles',{name:cn.value||'My Circle'});go('circle',c.id)}catch(e){err(e)}}
async function jn(){try{const c=await api('circles/join',{code:cc.value});go('circle',c.id)}catch(e){err(e)}}
async function circle(id,tab='all'){const c=await api('circle?id='+id),rows=c.boards[tab];
 $.innerHTML=`<div class="card big"><b>${esc(c.name)}</b><br>Invite code: <b style="font-size:28px;letter-spacing:3px">${c.code}</b><br><button class=alt onclick="navigator.clipboard&&navigator.clipboard.writeText('Join my Poop Wars circle! Code: ${c.code} — '+location.origin);this.textContent='Copied!'">📋 Copy invite</button></div>
 <h2>👑 Circle leaders</h2><div class=card>${Object.keys(G).map(t=>{const top=c.boards[t][0];return top&&top.w?`<div class=row><span>${G[t].e} ${G[t].n}</span><b>${esc(top.name)} (${top.w}W)</b></div>`:''}).join('')||'<small>No games finished yet.</small>'}</div>
 <h2>🏆 Rankings</h2><div class=tabs>${['all',...Object.keys(G)].map(t=>`<button class="sm ${t===tab?'on':'alt'}" onclick="go('circle','${id}','${t}')">${t==='all'?'Overall':G[t].e+' '+G[t].n}</button>`).join('')}</div>
 <div class=card>${rows.map((m,i)=>`<div class=row><span>${['👑','🥈','🥉'][i]||'🧻'} ${esc(m.name)}${m.id===me.id?' <small>(you)</small>':''}</span><span>${rec(m)}</span></div>`).join('')}</div>
 <small>To challenge someone, pick a game in the 🕹️ Arcade.</small>`}
async function lb(tab='all'){const l=await api('leaderboard?type='+tab);
 $.innerHTML=`<h2>🌍 Global Throne Rankings</h2><div class=tabs>${['all',...Object.keys(G)].map(t=>`<button class="sm ${t===tab?'on':'alt'}" onclick="go('lb','${t}')">${t==='all'?'Overall':G[t].e+' '+G[t].n}</button>`).join('')}</div>
 <div class=card>${l.map((x,i)=>`<div class=row><span>${['👑','🥈','🥉'][i]||(i+1)+'.'} ${esc(x.name)}</span><span>${rec(x)}</span></div>`).join('')||'Nobody has played this yet.'}</div>
 <div class=card><b>Your vs 🪠 Plunger Bot record</b>${Object.keys(G).map(t=>`<div class=row><span>${G[t].e} ${G[t].n}</span><span>${rec(me.botStats[t])}</span></div>`).join('')}</div>`}
async function ch(c,o,t,d){try{const w=window.sw&&sw.value.trim();const g=await api('challenge',{circleId:c,opponentId:o,type:t,difficulty:d,word:t==='hang'&&o!=='bot'?w:undefined});go('game',g.id)}catch(e){err(e)}}
async function mv(id,b){try{await api('move',{gameId:id,...b});game(id)}catch(e){err(e)}}
async function game(id){const g=await api('game?id='+id),opp=esc(g.names[1-g.me]),x=G[g.type];
 let res=g.status!=='done'?'':g.winner===me.id?'🏆 You won! Flush with pride.':g.winner==='draw'?'🤝 Draw. Nobody flushed.':'💀 You lost. Wipe away the tears.';
 let h=`<div class="card big" style="background:${x.c};color:#fff"><b>${x.e} ${x.n}</b><br>You ${MK[g.me]} vs ${opp} ${MK[1-g.me]}${g.vsBot?' · '+g.diff:''}</div>`;
 const status=res||(g.myTurn?'👉 Your turn!':'⏳ Waiting for '+opp+'… (auto-refreshing)');
 h+=(R[g.type]||(()=>''))(g,status,opp);
 if(g.status==='done')h+=`<button onclick="ch(${g.circleId?`'${g.circleId}'`:null},'${g.players[1-g.me]}','${g.type}','${g.diff||''}')">🔁 Rematch</button> <button class=alt onclick="go('home')">🕹️ Arcade</button>`;
 $.innerHTML=h;if(g.status==='active')poll=setInterval(async()=>{const g2=await api('game?id='+id);if(g2.updated!==g.updated)game(id)},3000)}
const R={
 ttt:(g,s)=>`<div class="card big">${s}</div><div class="card ttt">${g.board.map((v,i)=>`<div onclick="mv('${g.id}',{pos:${i}})">${v==null?'':MK[v]}</div>`).join('')}</div>`,
 c4:(g,s)=>`<div class="card big">${s}</div><div class="card c4">${g.board.map((v,i)=>`<div onclick="mv('${g.id}',{pos:${i%7}})">${v==null?'':MK[v]}</div>`).join('')}</div><small>Tap any spot in a column to drop your piece.</small>`,
 follow:(g,s,opp)=>{const mine=g.res[me.id];
  if(g.status==='done'){const th=g.res[g.players[1-g.me]];return`<div class="card big">${s}<br>You: ${fb(mine)}<br>${esc(opp)}: ${fb(th)}</div>`}
  if(mine)return`<div class="card big">Your run: ${fb(mine)} 🔒<br>Waiting for ${esc(opp)} to play…</div>`;
  if(g.started)return`<div class="card big">You left in the middle of your run, so it ends here.<br><button onclick="follow('${g.id}',1)">Submit my run</button></div>`;
  return`<div class="card big">Watch the pads, then repeat the pattern. It grows each round.<br><b>One try only</b> — don't leave mid-run!<br><button onclick="follow('${g.id}')">Start! 🚽</button></div>`},
 dots:(g,s)=>{const sc=[0,1].map(p=>g.boxes.filter(b=>b===p).length);let cells='';
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){if(r%2==0&&c%2==0)cells+='<div class=d></div>';
   else if(r%2==0){const i=(r/2)*4+(c-1)/2;cells+=`<div class="h ${g.lines[i]!=null?'p'+g.lines[i]:''}" onclick="mv('${g.id}',{pos:${i}})"></div>`}
   else if(c%2==0){const i=20+((r-1)/2)*5+c/2;cells+=`<div class="v ${g.lines[i]!=null?'p'+g.lines[i]:''}" onclick="mv('${g.id}',{pos:${i}})"></div>`}
   else{const k=((r-1)/2)*4+(c-1)/2;cells+=`<div class=b>${g.boxes[k]==null?'':MK[g.boxes[k]]}</div>`}}
  return`<div class="card big">${s}<br>Stalls: You ${sc[g.me]} · Them ${sc[1-g.me]}</div><div class="card dots">${cells}</div><small>Tap the space between two dots to build a wall. Your walls are ${g.me?'gold':'brown'}.</small>`},
 sink:(g,s,opp)=>{if(g.phase==='setup'&&!g.myShips)return placeUI(g);if(g.phase==='setup')return`<div class="card big">Your stuff is hidden 🤫<br>Waiting for ${opp} to hide theirs…</div>`;
  const sunk={};(g.sunkTheirs||[]).forEach(x=>x.cells.forEach(c=>sunk[c]=SHIPS[x.k].e));const their={};(g.theirShips||[]).forEach((c,k)=>c.forEach(y=>their[y]=SHIPS[k].e));
  const mine={};g.myShips.forEach((c,k)=>c.forEach(y=>mine[y]=SHIPS[k].e));const ls=g.lastShot;
  const msg=ls?`${ls.by===g.me?'You':opp} ${ls.result==='miss'?'missed 💧':ls.result==='hit'?'hit something 💥':'SANK the '+SHIPS[ls.ship].n+' '+SHIPS[ls.ship].e}`:'';
  return`<div class="card big">${s}<br><small>${msg}</small></div><h2>🎯 Their pipes</h2><div class="sea">${[...Array(64).keys()].map(i=>{const v=g.myShots[i];
   return`<div class="${!v&&g.myTurn?'tap':''}" ${!v&&g.myTurn?`onclick="mv('${g.id}',{pos:${i}})"`:''}>${sunk[i]||(v==='hit'?'💥':v==='miss'?'💧':their[i]?'<small style=opacity:.5>'+their[i]+'</small>':'')}</div>`}).join('')}</div>
   <small>Sunk: ${(g.sunkTheirs||[]).map(x=>SHIPS[x.k].e+' '+SHIPS[x.k].n).join(', ')||'nothing yet'}</small>
   <h2>🚽 Your pipes</h2><div class="sea small">${[...Array(64).keys()].map(i=>{const v=g.theirShots[i];return`<div class="${mine[i]?'ship':''}">${v==='hit'?'💥':v==='miss'?'💧':mine[i]||''}</div>`}).join('')}</div>`},
 hang:(g,s,opp)=>{const left=g.maxMiss-g.myMiss;let h=`<div class="card big">${s}</div><div class="card big"><div style="font-size:30px">🧻${'▮'.repeat(left)}<span style="opacity:.25">${'▯'.repeat(g.myMiss)}</span></div><small>${left} sheets of TP left</small><div class=word>${g.mask.join(' ')}</div>`;
  if(!g.myOver)h+=`</div><div class="card kb">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<button ${g.myGuesses.includes(l)?'disabled':''} onclick="mv('${g.id}',{letter:'${l}'})">${l}</button>`).join('')}</div>`;
  else h+=`<br>${g.solved?`Solved with ${g.myMiss} miss${g.myMiss==1?'':'es'}!`:'Out of TP! 😱'}</div>`;
  if(g.myOver&&g.status==='active')h+=`<div class="card big">Waiting for ${opp} to finish their word…</div>`;
  if(g.status==='done')h+=`<div class="card big">${opp}'s word: <b>${g.theirWord}</b> · ${g.theirSolved?g.theirMiss+' misses':'not solved'}</div>`;return h}};
// Sink the Stink placement
function randShips(){for(;;){const used=new Set(),out=[];let ok=true;for(const{s:n}of SHIPS){let p=false;for(let t=0;t<100&&!p;t++){const h=Math.random()<.5,r=Math.random()*(h?8:9-n)|0,c=Math.random()*(h?9-n:8)|0;
 const cells=Array.from({length:n},(_,i)=>h?r*8+c+i:(r+i)*8+c);if(cells.every(x=>!used.has(x))){cells.forEach(x=>used.add(x));out.push(cells);p=true}}if(!p){ok=false;break}}if(ok)return out}}
function placeUI(g){const p=place[g.id]=place[g.id]||{ships:[],h:true},next=SHIPS[p.ships.length],own={};p.ships.forEach((c,k)=>c.forEach(y=>own[y]=SHIPS[k].e));
 return`<div class="card big">Hide your stuff in the pipes!<br>${next?`Tap where the <b>${next.e} ${next.n}</b> (${next.s} long) starts`:'All hidden. Ready?'}</div>
 <div class="sea">${[...Array(64).keys()].map(i=>`<div class="tap ${own[i]?'ship':''}" onclick="putShip('${g.id}',${i})">${own[i]||''}</div>`).join('')}</div>
 <button class=alt onclick="place['${g.id}'].h=!place['${g.id}'].h;game('${g.id}')">↻ ${p.h?'Sideways':'Up-down'}</button><button class=alt onclick="place['${g.id}'].ships=randShips();game('${g.id}')">🎲 Random</button><button class=alt onclick="place['${g.id}'].ships=[];game('${g.id}')">Clear</button>
 ${p.ships.length===4?`<button onclick="mv('${g.id}',{ships:place['${g.id}'].ships})">✅ Lock it in</button>`:''}`}
function putShip(id,i){const p=place[id],n=SHIPS[p.ships.length];if(!n)return;const r=i>>3,c=i&7;if(p.h?c+n.s>8:r+n.s>8)return alert('Doesn’t fit there');
 const cells=Array.from({length:n.s},(_,k)=>p.h?i+k:i+8*k);if(cells.some(x=>p.ships.flat().includes(x)))return alert('Overlaps something');p.ships.push(cells);game(id)}
const PADS=[['🧻','#e8c547'],['💩','#8e5b34'],['🚽','#4f9bd1'],['🪠','#d0493d']];
async function follow(id,quit){clearInterval(poll);if(quit){try{await api('move',{gameId:id,len:0,ms:0})}catch(e){err(e)}return game(id)}
 let g;try{await api('move',{gameId:id,start:true});g=await api('game?id='+id)}catch(e){return err(e)}
 const seq=g.seq,sl=ms=>new Promise(r=>setTimeout(r,ms));let total=0,len=0;
 $.innerHTML=`<div class="card big" id=ct>Get ready…</div><div class="card pads">${PADS.map((p,i)=>`<div id=pd${i} style="background:${p[1]}">${p[0]}</div>`).join('')}</div>`;
 const pads=PADS.map((_,i)=>document.getElementById('pd'+i)),lit=async(i,ms)=>{pads[i].classList.add('lit');await sl(ms);pads[i].classList.remove('lit')};
 const done=async msg=>{pads.forEach(p=>p.onpointerdown=null);ct.innerHTML=msg+`<br>Pattern: <b>${len}</b> long · ${(total/1000).toFixed(1)}s`;
  try{await api('move',{gameId:id,len,ms:Math.round(total)})}catch(e){err(e)}setTimeout(()=>game(id),2000)};
 await sl(800);
 for(let r=1;r<=seq.length;r++){ct.textContent=`Round ${r} · watch…`;pads.forEach(p=>p.onpointerdown=null);await sl(500);
  const on=Math.max(220,550-r*20);for(let k=0;k<r;k++){await lit(seq[k],on);await sl(140)}
